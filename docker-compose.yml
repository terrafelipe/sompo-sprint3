# Stack local: Nginx (proxy reverso) na frente do Gunicorn (API Flask).
# Reproduz o desenho "de producao" que roda num EC2, mas na sua maquina e de
# graca. Sobe tudo com UM comando:
#
#     docker compose up --build
#
# Depois acesse:  http://localhost:8080
#
# O Render continua intocado (usa o api/Dockerfile com waitress). Este arquivo
# so muda o CMD para gunicorn na hora de subir localmente.

services:
  # ---- API Flask servida pelo Gunicorn -------------------------------------
  api:
    build:
      context: ./api          # mesmo Dockerfile que o Render usa
      dockerfile: Dockerfile
    # Troca o waitress pelo gunicorn (3 workers). 'app:app' = objeto Flask 'app'
    # definido em app.py. So o Nginx enxerga esta porta (nao publicamos no host),
    # forcando o trafego a passar pelo proxy.
    command: gunicorn --bind 0.0.0.0:5000 --workers 3 app:app
    env_file:
      - ./api/.env            # segredos (Supabase, Gemini, SOMPO_API_KEY). Fica local, fora do Git.
    expose:
      - "5000"
    restart: unless-stopped

  # ---- Nginx como proxy reverso --------------------------------------------
  nginx:
    image: nginx:1.27-alpine
    ports:
      - "8080:80"             # navegador -> http://localhost:8080 -> Nginx -> Gunicorn
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - api
    restart: unless-stopped
