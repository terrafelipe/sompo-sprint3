# Nginx como proxy reverso na frente do Gunicorn (stack local, custo zero).
# O navegador fala com o Nginx (porta 80 do container); o Nginx repassa tudo
# para o Gunicorn, que roda a API Flask. Mesmo desenho de um EC2 de producao,
# so que rodando na sua maquina via docker compose.

upstream sompo_api {
    # 'api' e o nome do servico no docker-compose.yml (DNS interno do compose).
    # 5000 e a porta em que o Gunicorn escuta dentro do container.
    server api:5000;
}

server {
    listen 80;
    server_name localhost;

    # Repassa TODA requisicao para o Gunicorn.
    location / {
        proxy_pass http://sompo_api;

        # Cabecalhos padrao de proxy reverso: preservam host e IP de origem para
        # que a API "enxergue" o cliente real, e nao o container do Nginx.
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
