# Blueprint do Render para o painel + API SOMPO (precisa ficar na RAIZ do repo).
# No Render: New > Blueprint > aponte para este repo. As envs com sync:false
# NAO ficam no repositorio - voce preenche os valores no painel do Render.
services:
  - type: web
    name: sompo-painel
    runtime: docker
    # O Dockerfile e o contexto de build ficam em api/ (o `COPY . .` do Dockerfile
    # espera o conteudo de api/, e o .dockerignore fica na raiz desse contexto).
    dockerfilePath: ./api/Dockerfile
    dockerContext: ./api
    plan: free
    # Sem healthCheckPath: com o login ligado, TODO o site (inclusive /saude) pede
    # senha, entao o Render checa apenas se a porta esta no ar. Assim nada fica exposto.
    envVars:
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SECRET_KEY
        sync: false
      - key: LLM_API_KEY
        sync: false
      - key: LLM_MODEL
        value: gemini-flash-lite-latest
      - key: PAINEL_USUARIO
        sync: false
      - key: PAINEL_SENHA
        sync: false
      # Assina o cookie de sessao do login. Gerada pelo Render (fixa entre deploys),
      # para a sessao nao cair a cada restart.
      - key: SECRET_KEY
        generateValue: true
